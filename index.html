<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b3d2e">
<title>তালিমাত / تعليمات</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--primary:#0b3d2e;--primary-light:#145c46;--accent:#2ecc71;
--bg:#f0f4f2;--card:#ffffff;--text:#1a1a1a;--text-muted:#666;
--border:#e0e0e0;--good:#0a7d3e;--warn:#d68910;--bad:#c0392b;--info:#2980b9;
}
[data-theme="blue"]{--primary:#1a3a6e;--primary-light:#2c5aa0;--accent:#4a90e2;--bg:#eef4fb}
[data-theme="purple"]{--primary:#4a1a6e;--primary-light:#6c2aa0;--accent:#a855f7;--bg:#f4eefb}
[data-theme="dark"]{--primary:#1a1a1a;--primary-light:#2d2d2d;--bg:#121212;--card:#1e1e1e;--text:#e8e8e8;--text-muted:#aaa;--border:#333}
[data-theme="sepia"]{--primary:#5d4e37;--primary-light:#7d6e57;--accent:#c9a96e;--bg:#f5f0e6;--card:#fffaf0}
[data-theme="rose"]{--primary:#6e1a3a;--primary-light:#a02c5a;--accent:#ec4899;--bg:#fbeef4}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans Bengali',sans-serif;background:var(--bg);color:var(--text);font-size:15px;padding-bottom:80px;transition:background .3s}
body.ar{direction:rtl}
.hidden{display:none!important}

header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:14px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
header h1 .ar{font-family:'Amiri',serif;font-size:20px;opacity:.85}
.icon-btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.28);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin:0}

.container{max-width:600px;margin:0 auto;padding:14px}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card h3{font-size:16px;margin-bottom:12px;color:var(--primary);display:flex;align-items:center;gap:8px}
.card h4{font-size:15px;margin-bottom:10px;color:var(--primary)}

input,select,textarea{width:100%;padding:12px;border:2px solid var(--border);border-radius:10px;margin:6px 0;font-family:inherit;font-size:15px;background:var(--card);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary)}
label{font-size:14px;color:var(--text-muted);font-weight:600;display:block;margin-top:10px}

button{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px}
button:active{transform:scale(.98);opacity:.9}
button.secondary{background:var(--border);color:var(--primary)}
button.danger{background:linear-gradient(135deg,#c0392b,#e74c3c)}
button.small{padding:10px 16px;font-size:14px;width:auto}
button.tiny{padding:6px 12px;font-size:13px;width:auto;margin:0}

.t-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.t-row:last-child{border-bottom:none}
.t-name{font-weight:600;font-size:14px}
.t-dept{font-size:12px;color:var(--text-muted);margin-top:2px}
.t-score{font-weight:700;font-size:16px}
.good{color:var(--good)}.bad{color:var(--bad)}.mid{color:var(--warn)}

.avatar{width:44px;height:44px;border-radius:50%;background:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--primary);overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-lg{width:90px;height:90px;font-size:34px}

.slider-box{margin:10px 0;padding:12px;background:var(--bg);border-radius:10px}
.slider-box label{display:flex;justify-content:space-between;margin-bottom:6px;color:var(--text)}
.slider-val{background:var(--primary);color:#fff;padding:2px 10px;border-radius:12px;font-size:13px;font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;background:transparent;padding:0;margin:0;border:none}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:var(--border);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:22px;width:22px;background:var(--primary);border-radius:50%;margin-top:-8px;box-shadow:0 2px 4px rgba(0,0,0,.2)}

.alert{padding:12px;border-radius:10px;margin-bottom:8px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.alert.warn{background:#fdeaea;border-left:4px solid var(--bad);color:#1a1a1a}
.alert.good{background:#e8f5ee;border-left:4px solid var(--good);color:#1a1a1a}
.alert.info{background:#e8f4ff;border-left:4px solid var(--info);color:#1a1a1a}
.alert.gold{background:#fff8e1;border-left:4px solid #d4af37}

.msg{padding:14px;border-radius:10px;margin-bottom:10px;font-size:14px;line-height:1.6}
.msg.appreciation{background:#e8f5ee;border-left:4px solid var(--good);color:#1a1a1a}
.msg.encouragement{background:#fff8e1;border-left:4px solid var(--warn);color:#1a1a1a}
.msg.warning{background:#fdeaea;border-left:4px solid var(--bad);color:#1a1a1a}
.msg small{color:#666;display:block;margin-bottom:6px}
.msg .ar{font-family:'Amiri',serif;direction:rtl;text-align:right;margin-top:8px;padding-top:8px;border-top:1px dashed #ccc;font-size:16px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);padding:14px;border-radius:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.stat .num{font-size:24px;font-weight:700;color:var(--primary)}
.stat .lbl{font-size:12px;color:var(--text-muted);margin-top:4px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:99;border-top:1px solid var(--border);padding:4px 0;overflow-x:auto}
.bottom-nav button{flex:1 1 0;min-width:60px;background:transparent;color:var(--text-muted);padding:8px 2px;border-radius:0;font-size:10px;margin:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button .ico{font-size:18px;line-height:1}

.loading{text-align:center;padding:30px;color:var(--text-muted)}
.spinner{display:inline-block;width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;z-index:999;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.toast.err{background:#c0392b}
.toast.ok{background:#0a7d3e}

.progress{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s}

.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.theme-item{border-radius:12px;padding:12px;text-align:center;cursor:pointer;border:3px solid transparent}
.theme-item.active{border-color:var(--primary)}
.theme-item .dot{width:32px;height:32px;border-radius:50%;margin:0 auto 6px}
.theme-item .name{font-size:12px;font-weight:600;color:#1a1a1a}

.chart-box{background:var(--bg);border-radius:10px;padding:10px;margin-top:10px;overflow-x:auto}
canvas{display:block;max-width:100%}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:0 0 auto;padding:8px 14px;font-size:13px;border-radius:20px;background:var(--border);color:var(--text);font-weight:600;width:auto;margin:0}
.tabs button.active{background:var(--primary);color:#fff}

.trend-badge{padding:4px 12px;border-radius:16px;font-size:13px;font-weight:700;display:inline-block}
.trend-improving{background:#e8f5ee;color:var(--good)}
.trend-declining{background:#fdeaea;color:var(--bad)}
.trend-stable{background:#f5f5f5;color:#666}
.trend-new{background:#e8f4ff;color:var(--info)}

.week-row{padding:14px;border-radius:12px;background:var(--bg);margin-bottom:10px}
.week-row .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.week-row .name{font-weight:700;font-size:15px}
.week-scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.week-score{background:var(--card);padding:10px;border-radius:10px;text-align:center}
.week-score .lbl{font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.week-score .val{font-size:20px;font-weight:700}

.attendance-row{padding:12px;border-radius:10px;background:var(--bg);margin-bottom:8px;font-size:14px}
.attendance-reasons{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.6}
.attendance-reasons .reason{display:inline-block;background:var(--card);padding:3px 9px;border-radius:8px;margin:3px 3px 0 0;font-size:12px;font-weight:600}

.divider{height:1px;background:var(--border);margin:14px 0}
.big-score{text-align:center;padding:20px;background:var(--bg);border-radius:12px;margin:12px 0}
.big-score .val{font-size:44px;font-weight:800;line-height:1}
.big-score .lbl{font-size:14px;color:var(--text-muted);margin-top:6px}

.entry-detail{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--primary)}
.entry-detail .entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.entry-detail .entry-date{font-size:14px;color:var(--text-muted);font-weight:600}
.entry-detail .entry-avg{font-size:22px;font-weight:800;padding:4px 12px;border-radius:10px;background:var(--card)}
.entry-detail .entry-avg.good{color:var(--good)}
.entry-detail .entry-avg.mid{color:var(--warn)}
.entry-detail .entry-avg.bad{color:var(--bad)}

.duty-grid{display:grid;gap:8px;margin-top:10px}
.duty-item{background:var(--card);border-radius:10px;padding:10px 12px}
.duty-item .duty-info{margin-bottom:6px}
.duty-item .duty-name{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.4}
.duty-item .duty-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.duty-item .duty-bar-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s}
.duty-item .duty-score-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.duty-item .duty-score{font-size:17px;font-weight:800;color:var(--primary)}
.duty-item .duty-reason{font-size:12px;color:var(--bad);font-weight:600;font-style:italic;margin-top:4px;padding:4px 8px;background:#fdeaea;border-radius:6px;display:inline-block}

.entry-remark{background:var(--card);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px;line-height:1.6}
.entry-remark .label{font-weight:700;color:var(--primary);margin-bottom:4px;font-size:12px}

.entry-msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;line-height:1.7}
.entry-msg.appreciation{background:#e8f5ee;border-left:4px solid var(--good)}
.entry-msg.encouragement{background:#fff8e1;border-left:4px solid var(--warn)}
.entry-msg.warning{background:#fdeaea;border-left:4px solid var(--bad)}
.entry-msg .label{font-weight:700;margin-bottom:4px;font-size:12px}
.entry-msg .ar{font-family:'Amiri',serif;direction:rtl;text-align:right;font-size:15px;margin-top:6px;padding-top:6px;border-top:1px dashed #ccc}

.entry-list-item{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px;cursor:pointer}
.entry-list-item .date{font-weight:700;font-size:14px;color:var(--primary)}
.entry-list-item .meta{font-size:12px;color:var(--text-muted);margin-top:2px}
.entry-list-item .score{font-size:20px;font-weight:800;min-width:44px;text-align:right}
.entry-list-item .actions{display:flex;gap:6px;margin-top:6px}

.summary-card{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:14px;padding:18px;margin-bottom:14px}
.summary-card .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
.summary-card .item .num{font-size:24px;font-weight:800}
.summary-card .item .lbl{font-size:12px;opacity:.9;margin-top:4px}

.reason-input-row{display:flex;gap:8px;margin-top:8px}

.routine-item{padding:12px;background:var(--bg);border-radius:10px;margin-bottom:8px;font-size:14px}
.routine-item .head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}

.award-item{padding:14px;border-radius:12px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.award-item.rank-1{background:linear-gradient(135deg,#ffd700,#ffb347);color:#1a1a1a}
.award-item.rank-2{background:linear-gradient(135deg,#e0e0e0,#b0b0b0);color:#1a1a1a}
.award-item.rank-3{background:linear-gradient(135deg,#cd7f32,#a0522d);color:#fff}
.award-item .rank{font-size:26px;font-weight:800;min-width:44px;text-align:center}
.award-item .info{flex:1}
.award-item .name{font-weight:700;font-size:15px}
.award-item .score{font-size:13px;opacity:.85;margin-top:2px}

.dup-warning{background:#fff3cd;border-left:4px solid #ff9800;padding:14px;border-radius:10px;margin-bottom:12px;font-size:14px;color:#1a1a1a}
.dup-warning .title{font-weight:700;margin-bottom:6px;color:#e65100}
.dup-warning button{margin-top:10px;padding:8px;font-size:14px}

@media print{
  header, .bottom-nav, button, .tabs, .toast, .icon-btn { display: none !important; }
  body { padding-bottom: 0 !important; background: #fff !important; }
  .container { max-width: 100% !important; padding: 0 !important; }
  .card { box-shadow: none !important; page-break-inside: avoid; margin-bottom: 8px; }
  .chart-box { display: none !important; }
  #printHeader { display: block !important; text-align: center; margin-bottom: 20px; padding: 10px; }
}

#printHeader { display: none; }
</style>
</head>
<body>

<header>
<div class="header-row">
<h1>📚 <span>তালিমাত</span> <span class="ar">تعليمات</span></h1>
<button class="icon-btn" onclick="openSettings()">⚙️</button>
</div>
</header>

<div class="container" id="app"></div>

<nav class="bottom-nav hidden" id="nav">
<button data-tab="home" onclick="switchTab('home')"><span class="ico">🏠</span><span>হোম</span></button>
<button data-tab="entry" onclick="switchTab('entry')"><span class="ico">✍️</span><span>এন্ট্রি</span></button>
<button data-tab="negrani" onclick="switchTab('negrani')"><span class="ico">👁️</span><span>নেগরানী</span></button>
<button data-tab="attendance" onclick="switchTab('attendance')"><span class="ico">🎓</span><span>উপস্থিতি</span></button>
<button data-tab="teachers" onclick="switchTab('teachers')"><span class="ico">👥</span><span>শিক্ষক</span></button>
<button data-tab="routine" onclick="switchTab('routine')"><span class="ico">📅</span><span>রুটিন</span></button>
<button data-tab="awards" onclick="switchTab('awards')"><span class="ico">🏆</span><span>পুরস্কার</span></button>
<button data-tab="search" onclick="switchTab('search')"><span class="ico">🔍</span><span>সার্চ</span></button>
<button data-tab="reports" onclick="switchTab('reports')"><span class="ico">📊</span><span>রিপোর্ট</span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzPWOJws10I0jXlNe6CkdNd68nmgV-6JS35Rch0FF64ChmX0_-tOFs_mbgjVm5_5CLTXw/exec";
const APP_NAME_BN = "তালিমাত";
const APP_NAME_AR = "تعليمات";

let LANG = localStorage.getItem('lang') || 'bn';
let THEME = localStorage.getItem('theme') || 'green';
let USER = JSON.parse(localStorage.getItem('user') || 'null');
let CACHE = { teachers: [], entries: [], messages: [], dashboard: null, attendance: [], negrani: [], attendanceSummary: null, routine: [], awards: [] };
let CURRENT_TAB = 'home';
let SHOW_SETTINGS = false;
let SHOW_ENTRY_DETAIL = null;
let SHOW_PROFILE = null;
let EDIT_ENTRY = null;
let EDIT_ATTENDANCE = null;
let DUP_WARNING = null;
let SEARCH_RESULTS = null;
let SEARCH_FILTERS = { name: '', department: '', min_avg: '', max_avg: '', sort: 'avg_desc' };
let COMPARE_MODE = false;
let COMPARE_WEEK1 = 'this';
let COMPARE_WEEK2 = 'last';

const CLASS_GROUPS = [
{ name: "১ম", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "২য়", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "৩য়", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "৪র্থ", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "৫ম", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "৬ষ্ঠ", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "৭ম", sections: ["ক","খ","গ","ঘ","ঙ","চ","ছ","জ"] },
{ name: "৮ম", sections: ["ক","খ","গ"] },
{ name: "কাফিয়া", sections: ["ক","খ","গ"] },
{ name: "শরহেবেকায়া", sections: ["ক","খ","গ"] },
{ name: "জালালাইন", sections: ["ক","খ","গ"] },
{ name: "মেশকাত", sections: ["ক","খ","গ"] },
{ name: "দাওরা", sections: ["ক","খ","গ"] },
{ name: "তাহফিযুল কুরআন", sections: ["গ্রুপ ১","গ্রুপ ২","গ্রুপ ৩","গ্রুপ ৪","গ্রুপ ৫","গ্রুপ ৬","গ্রুপ ৭","গ্রুপ ৮","গ্রুপ ৯","গ্রুপ ১০","গ্রুপ ১১","গ্রুপ ১২","গ্রুপ ১৩","গ্রুপ ১৪","গ্রুপ ১৫","গ্রুপ ১৬","গ্রুপ ১৭","গ্রুপ ১৮","গ্রুপ ১৯","গ্রুপ ২০"] },
{ name: "প্লে (অনাবাসিক)", sections: ["ক","খ"] },
{ name: "নার্সারী (অনাবাসিক)", sections: ["ক","খ"] },
{ name: "১ম (অনাবাসিক)", sections: ["ক","খ"] },
{ name: "২য় (অনাবাসিক)", sections: ["ক","খ"] },
{ name: "৩য় (অনাবাসিক)", sections: ["ক","খ"] },
{ name: "৪র্থ (অনাবাসিক)", sections: ["ক","খ"] },
{ name: "৫ম (অনাবাসিক)", sections: ["ক","খ"] }
];

const DAYS = ["শনিবার","রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার"];

function t(k){ return k; }
function toast(msg, type){
const el = document.getElementById('toast');
el.textContent = msg;
el.className = 'toast show' + (type === 'err' ? ' err' : type === 'ok' ? ' ok' : '');
setTimeout(()=>el.className = 'toast', 2500);
}
function loading(){ return `<div class="loading"><div class="spinner"></div><p style="margin-top:10px">লোড হচ্ছে...</p></div>`; }
function scoreClass(avg){ avg = parseFloat(avg); if (isNaN(avg)) return ''; if (avg >= 7) return 'good'; if (avg <= 4) return 'bad'; return 'mid'; }
function trendLabel(trend){
if (trend === 'improving') return '📈 উন্নতি';
if (trend === 'declining') return '📉 অবনতি';
if (trend === 'stable') return '➡️ স্থিতিশীল';
if (trend === 'new') return '🆕 নতুন';
return '';
}
function applyTheme(){ document.documentElement.setAttribute('data-theme', THEME); }
function setTheme(name){ THEME = name; localStorage.setItem('theme', name); applyTheme(); render(); }
function setLang(lang){ LANG = lang; localStorage.setItem('lang', lang); document.body.classList.toggle('ar', LANG === 'ar'); render(); }
function openSettings(){ SHOW_SETTINGS = true; SHOW_ENTRY_DETAIL = null; SHOW_PROFILE = null; render(); }
function closeSettings(){ SHOW_SETTINGS = false; render(); }

function avatarHtml(photo, name, size){
const cls = size === 'lg' ? 'avatar avatar-lg' : 'avatar';
if (photo && photo.trim()) {
return `<div class="${cls}"><img src="${photo}" alt="" onerror="this.parentElement.innerHTML='👤'"></div>`;
}
return `<div class="${cls}">👤</div>`;
}

async function api(action, params = {}) {
const qs = new URLSearchParams({ action, ...params }).toString();
const res = await fetch(`${API_URL}?${qs}`);
return res.json();
}

function render(){
applyTheme();
document.body.classList.toggle('ar', LANG === 'ar');
if (SHOW_SETTINGS) return renderSettings();
if (typeof SHOW_ADMIN !== 'undefined' && SHOW_ADMIN) return renderAdminPanel();
if (!USER) return renderLogin();
document.getElementById('nav').classList.remove('hidden');
document.querySelectorAll('.bottom-nav button').forEach(b=>{
const tab = b.dataset.tab;
if (USER.role === 'teacher' && (tab === 'entry' || tab === 'routine' || tab === 'search')) b.classList.add('hidden');
else if (USER.role === 'supervisor' && tab === 'awards') b.classList.add('hidden');
else b.classList.remove('hidden');
});
if (SHOW_ENTRY_DETAIL) return renderEntryDetailPage();
if (SHOW_PROFILE) return renderProfilePage(SHOW_PROFILE);
if (USER.role === 'admin') renderAdmin();
else if (USER.role === 'supervisor') renderSupervisor();
else renderTeacher();
updateNavActive();
}
function updateNavActive(){ document.querySelectorAll('.bottom-nav button').forEach(b=>{ b.classList.toggle('active', b.dataset.tab === CURRENT_TAB); }); }
function switchTab(tab){ CURRENT_TAB = tab; SHOW_SETTINGS = false; SHOW_ENTRY_DETAIL = null; SHOW_PROFILE = null; EDIT_ENTRY = null; EDIT_ATTENDANCE = null; DUP_WARNING = null; render(); }

async function enableNotifications(){
if (!('Notification' in window)) return toast('এই ব্রাউজারে নেই', 'err');
const perm = await Notification.requestPermission();
if (perm === 'granted') { new Notification(APP_NAME_BN, { body: 'চালু ✅' }); toast('✅ চালু', 'ok'); }
else toast('❌ অনুমতি নেই', 'err');
}

function renderLogin(){
document.getElementById('nav').classList.add('hidden');
document.getElementById('app').innerHTML = `
<div class="card" style="margin-top:40px">
<h3>🔐 লগইন</h3>
<input id="u" placeholder="ইউজারনেম" autocomplete="username">
<input id="p" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
<button onclick="doLogin()">প্রবেশ করুন</button>
<p id="err" style="color:#c0392b;margin-top:10px;font-size:14px"></p>
</div>`;
document.getElementById('p').addEventListener('keypress', e=>{ if (e.key === 'Enter') doLogin(); });
}
async function doLogin(){
const u = document.getElementById('u').value.trim();
const p = document.getElementById('p').value.trim();
if (!u || !p) return;
document.getElementById('err').textContent = '';
document.getElementById('app').innerHTML = loading();
try {
const r = await api('login', { username: u, password: p });
if (r.success) {
USER = r; localStorage.setItem('user', JSON.stringify(r));
toast('স্বাগতম, ' + (r.name || r.id), 'ok');
CURRENT_TAB = 'home';
await loadAllData();
} else {
renderLogin();
setTimeout(()=>{ document.getElementById('err').textContent = r.error || 'ভুল'; }, 100);
}
} catch(e) {
renderLogin();
setTimeout(()=>{ document.getElementById('err').textContent = 'সার্ভার: ' + e.message; }, 100);
}
}
function logout(){
USER = null; localStorage.removeItem('user'); localStorage.removeItem('talimat_cache');
CURRENT_TAB = 'home'; SHOW_SETTINGS = false; SHOW_ENTRY_DETAIL = null; SHOW_PROFILE = null;
render();
}

async function loadAllData(){
const saved = localStorage.getItem('talimat_cache');
if (saved) {
try {
const c = JSON.parse(saved);
Object.assign(CACHE, c);
render();
} catch(e) {}
}
try {
const r = await api('getAllData');
if (r.success) {
CACHE.teachers = r.teachers || [];
CACHE.dashboard = r.dashboard || null;
CACHE.entries = r.entries || [];
CACHE.attendance = r.attendance || [];
CACHE.negrani = r.negrani || [];
CACHE.attendanceSummary = r.attendanceSummary || null;
CACHE.routine = r.routine || [];
CACHE.awards = r.awards || [];
const deptResp = await api('getDepartments');
if (deptResp.success) CACHE.departments = deptResp.data;
if (USER.role === 'teacher') {
CACHE.entries = CACHE.entries.filter(e => e.Teacher_ID === USER.id);
CACHE.attendance = CACHE.attendance.filter(a => a.Teacher_ID === USER.id);
CACHE.negrani = CACHE.negrani.filter(n => n.Teacher_ID === USER.id);
}
try { localStorage.setItem('talimat_cache', JSON.stringify(CACHE)); } catch(e) {}
}
} catch(e) { console.warn(e); }
render();
}

function getMessageFor(avg){
const numAvg = parseFloat(avg);
if (numAvg >= 8) return { type:'appreciation', label:'🎉 অভিবাদন',
bn: "মাশাআল্লাহ! আপনার পাঠদানের মান প্রশংসনীয়। আল্লাহ আপনার ইলমে বারাকাহ দান করুন।",
ar: "ما شاء الله! جودة تدريسك ممتازة. بارك الله في علمك." };
if (numAvg >= 5) return { type:'encouragement', label:'🌟 উৎসাহ',
bn: "আপনার পাঠদান ভালো হচ্ছে, তবে আরও উন্নতির সুযোগ আছে। চেষ্টা চালিয়ে যান।",
ar: "تدريسك جيد، لكن هناك مجال للتحسين. واصل الجهد." };
return { type:'warning', label:'⚠️ সতর্কতা',
bn: "আপনার সাম্প্রতিক পারফরম্যান্সে অবনতি লক্ষ্য করা যাচ্ছে। অনুগ্রহ করে দায়িত্ব পুনর্বিবেচনা করুন।",
ar: "لوحظ تراجع في أدائك الأخير. يرجى مراجعة مسؤولياتك." };
}

function renderEntryDetailCard(entry, showBack){
const avg = parseFloat(entry.Average);

try { reasons = JSON.parse(entry.Reasons || '{}'); } catch(e) {}
const msg = getMessageFor(avg);
return `
${showBack ? `<button class="secondary small" onclick="closeEntryDetail()" style="margin-bottom:12px">← ফিরে যান</button>` : ''}
<div class="entry-detail">
<div class="entry-head">
<div class="entry-date">📅 ${String(entry.Date).slice(0,10)}</div>
<div class="entry-avg ${cls}">${entry.Average} / ১০</div>
</div>
<div class="duty-grid">
${DUTIES.map(d=>{
const val = parseFloat(entry[d.key]) || 0;
const pct = (val/10)*100;
const reason = reasons[d.id] || '';
return `<div class="duty-item">
<div class="duty-info">

<div class="duty-bar"><div class="duty-bar-fill" style="width:${pct}%"></div></div>

}).join('')}
</div>
${entry.Remark ? `<div class="entry-remark"><div class="label">📝 মন্তব্য</div><div>${entry.Remark}</div></div>`
: `<div class="entry-remark"><div class="label">📝 মন্তব্য</div><div style="color:var(--text-muted);font-style:italic">কোনো মন্তব্য নেই</div></div>`}

function renderEntryDetailPage(){
if (!SHOW_ENTRY_DETAIL) return render();
const { teacherId, entryIndex } = SHOW_ENTRY_DETAIL;
const entries = CACHE.entries.filter(e => e.Teacher_ID === teacherId).sort((a,b)=>new Date(b.Date)-new Date(a.Date));
const entry = entries[entryIndex];
if (!entry) { SHOW_ENTRY_DETAIL = null; return render(); }
const tch = CACHE.teachers.find(x => x.ID === teacherId);
const tName = tch ? tch.Name_Bangla : teacherId;
const canEdit = USER.role === 'admin' || USER.role === 'supervisor';
document.getElementById('app').innerHTML = `

}

function startEditEntry(teacherId, entryIndex){
const entries = CACHE.entries.filter(e => e.Teacher_ID === teacherId).sort((a,b)=>new Date(b.Date)-new Date(a.Date));
const entry = entries[entryIndex];
if (!entry) return;
EDIT_ENTRY = { entry, teacherId };
render();
}

async function saveEditedEntry(){
const e = EDIT_ENTRY.entry;
const params = { row: e._row, teacher_id: e.Teacher_ID, supervisor_id: e.Supervisor_ID, remark: document.getElementById('e_rmk').value };
DUTIES.forEach(d => { params[d.id] = document.getElementById(d.id).value; });
const reasons = {};
DUTIES.forEach(d => { const r = document.getElementById('er-'+d.id).value.trim(); if (r) reasons[d.id] = r; });
params.reasons = JSON.stringify(reasons);
document.getElementById('app').innerHTML = loading();
const r = await api('updateEntry', params);
if (r.success) { toast('✅ আপডেট হয়েছে', 'ok'); EDIT_ENTRY = null; SHOW_ENTRY_DETAIL = null; await loadAllData(); }
else { toast('❌ ব্যর্থ', 'err'); render(); }
}

async function confirmDeleteEntry(row){
if (!confirm('আপনি কি নিশ্চিত এই এন্ট্রি ডিলিট করতে চান?')) return;
document.getElementById('app').innerHTML = loading();
const r = await api('deleteEntry', { row });
if (r.success) { toast('🗑️ ডিলিট হয়েছে', 'ok'); EDIT_ENTRY = null; SHOW_ENTRY_DETAIL = null; await loadAllData(); }
else { toast('❌ ব্যর্থ', 'err'); render(); }
}

// --------- CHARTS ---------
function drawLineChart(canvasId, data){
const c = document.getElementById(canvasId);
if (!c || !data.length) return;
const ctx = c.getContext('2d');
const W = c.width, H = c.height;
const pad = {l:32, r:12, t:16, b:28};
const innerW = W - pad.l - pad.r;
const innerH = H - pad.t - pad.b;
ctx.clearRect(0,0,W,H);
ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--border') || '#e0e0e0';
ctx.lineWidth = 1;
for (let i=0; i<=5; i++){
const y = pad.t + (innerH/5)*i;
ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
ctx.fillStyle = '#888'; ctx.font = '10px sans-serif'; ctx.textAlign='right';
ctx.fillText((10 - i*2).toString(), pad.l-4, y+3);
}
const stepX = innerW / Math.max(1, data.length-1);
const pts = data.map((d,i)=>({ x: pad.l + stepX*i, y: pad.t + innerH - (d.value/10)*innerH }));
const primary = getComputedStyle(document.body).getPropertyValue('--primary').trim() || '#0b3d2e';
ctx.strokeStyle = primary; ctx.lineWidth = 2.5; ctx.beginPath();
pts.forEach((p,i)=> i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y));
ctx.stroke();
ctx.fillStyle = primary + '22';
ctx.beginPath(); ctx.moveTo(pts[0].x, pad.t+innerH);
pts.forEach(p=>ctx.lineTo(p.x, p.y));
ctx.lineTo(pts[pts.length-1].x, pad.t+innerH);
ctx.closePath(); ctx.fill();
ctx.fillStyle = primary;
pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI*2); ctx.fill(); });
ctx.fillStyle = '#888'; ctx.font = '9px sans-serif'; ctx.textAlign='center';
const skip = Math.ceil(data.length/8);
data.forEach((d,i)=>{ if (i % skip === 0 || i === data.length-1) ctx.fillText(d.label, pts[i].x, H-8); });
}

function drawBarChart(canvasId, data, horizontal){
const c = document.getElementById(canvasId);
if (!c || !data.length) return;
const ctx = c.getContext('2d');
const W = c.width, H = c.height;
ctx.clearRect(0,0,W,H);
const primary = getComputedStyle(document.body).getPropertyValue('--primary').trim() || '#0b3d2e';
const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#2ecc71';
if (horizontal) {
const pad = {l:100, r:40, t:10, b:10};
const rowH = (H - pad.t - pad.b) / data.length;
data.forEach((d,i)=>{
const y = pad.t + rowH*i + rowH*0.15;
const bh = rowH*0.7;
const bw = ((d.value||0)/10) * (W - pad.l - pad.r);
ctx.fillStyle = 'rgba(0,0,0,.06)';
ctx.fillRect(pad.l, y, W-pad.l-pad.r, bh);
const grad = ctx.createLinearGradient(pad.l, 0, pad.l+bw, 0);
grad.addColorStop(0, primary); grad.addColorStop(1, accent);
ctx.fillStyle = grad;
ctx.fillRect(pad.l, y, bw, bh);
ctx.fillStyle = '#333'; ctx.font = '11px sans-serif'; ctx.textAlign='right';
ctx.fillText((d.label||'').substring(0,14), pad.l-6, y+bh/2+4);
ctx.fillStyle = primary; ctx.textAlign='left'; ctx.font='bold 11px sans-serif';
ctx.fillText((d.value||0).toFixed(2), pad.l+bw+6, y+bh/2+4);
});
} else {
const pad = {l:30, r:10, t:10, b:60};
const innerW = W - pad.l - pad.r;
const innerH = H - pad.t - pad.b;
const bw = innerW / data.length * 0.7;
const gap = innerW / data.length * 0.3;
data.forEach((d,i)=>{
const bh = ((d.value||0)/10) * innerH;
const x = pad.l + i*(bw+gap) + gap/2;
const y = pad.t + innerH - bh;
const grad = ctx.createLinearGradient(0, y, 0, y+bh);
grad.addColorStop(0, accent); grad.addColorStop(1, primary);
ctx.fillStyle = grad;
ctx.fillRect(x, y, bw, bh);
ctx.fillStyle = primary; ctx.font='bold 10px sans-serif'; ctx.textAlign='center';
ctx.fillText((d.value||0).toFixed(1), x+bw/2, y-3);
ctx.save();
ctx.translate(x+bw/2, H-pad.b+8);
ctx.rotate(-Math.PI/4);
ctx.fillStyle = '#666'; ctx.font='9px sans-serif'; ctx.textAlign='right';
ctx.fillText((d.label||'').substring(0,12), 0, 0);
ctx.restore();
});
}
}

            <div style="display:flex;align-items:center;gap:10px">
              ${avatarHtml(t.Photo_URL, t.Name_Bangla)}
              <div>
                <div class="t-name">${t.Name_Bangla}</div>
                <div class="t-dept">${t.ID} • ${t.Department||''} • ${t.Supervisor_ID||'—'}</div>
              </div>
            </div>
            <div style="display:flex;gap:6px">
              <button class="tiny secondary" onclick="adminEditTeacher('${t.ID}')">✏️</button>
              <button class="tiny danger" onclick="adminConfirmDelete('${t.ID}')">🗑️</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function filterAdminList(q){
  q = q.toLowerCase();
  document.querySelectorAll('#admin_tlist .t-row').forEach(r=>{
    r.style.display = r.dataset.name.toLowerCase().includes(q) ? 'flex' : 'none';
  });
}

// ---------- EDIT TEACHER ----------
function adminEditTeacher(id){
  const tch = CACHE.teachers.find(x => x.ID === id);
  if (!tch) return;
  const sups = CACHE.supervisorList || [];
  const depts = CACHE.departments || [];
  document.getElementById('adminContent').innerHTML = `
    <div class="card">
      <button class="secondary small" onclick="adminView('list')" style="margin-bottom:12px">← ফিরে যান</button>
      <h4>✏️ সম্পাদনা: ${tch.Name_Bangla}</h4>
      <label>নাম (বাংলা)</label>
      <input id="ae_bn" value="${tch.Name_Bangla||''}">
      <label>নাম (আরবী)</label>
      <input id="ae_ar" value="${tch.Name_Arabic||''}" dir="rtl">
      <label>পদবী</label>
      <input id="ae_dg" value="${tch.Designation_Bangla||''}">
      <label>বিভাগ</label>
      <select id="ae_dept">
        <option value="">-- নির্বাচন --</option>
        ${depts.map(d=>`<option value="${d.Name}" ${tch.Department===d.Name?'selected':''}>${d.Name}</option>`).join('')}
      </select>
      <label>ফোন</label>
      <input id="ae_ph" value="${tch.Phone||''}">
      <label>সুপারভাইজার</label>
      <select id="ae_sup">
        <option value="">-- নির্বাচন --</option>
        ${sups.map(s=>`<option value="${s.ID}" ${tch.Supervisor_ID===s.ID?'selected':''}>${s.Name_Bangla} (${s.ID})</option>`).join('')}
      </select>
      <label>ছবির লিংক</label>
      <input id="ae_photo" value="${tch.Photo_URL||''}" placeholder="https://...">
      <button onclick="adminSaveTeacher('${id}')">✅ সেভ করুন</button>
      <button class="danger" onclick="adminConfirmDelete('${id}')">🗑️ ডিলিট করুন</button>
    </div>
  `;
}

async function adminSaveTeacher(id){
  const oldSup = CACHE.teachers.find(x=>x.ID===id)?.Supervisor_ID || '';
  const newSup = document.getElementById('ae_sup').value;
  const params = {
    id,
    name_bn: document.getElementById('ae_bn').value.trim(),
    name_ar: document.getElementById('ae_ar').value.trim(),
    designation: document.getElementById('ae_dg').value.trim(),
    department: document.getElementById('ae_dept').value,
    phone: document.getElementById('ae_ph').value.trim(),
    photo: document.getElementById('ae_photo').value.trim()
  };
  document.getElementById('adminContent').innerHTML = loading();
  const r1 = await api('adminUpdateTeacher', params);
  if (r1.success) {
    if (newSup !== oldSup) {
      await api('adminChangeSupervisor', { teacher_id: id, new_supervisor_id: newSup });
    }
    toast('✅ আপডেট সফল', 'ok');
    await loadAllData();
    ADMIN_VIEW = 'list';
    renderAdminPanel();
  } else {
    toast('❌ ' + (r1.error||''), 'err');
    renderAdminContent();
  }
}

// ---------- DELETE TEACHER ----------
function adminConfirmDelete(id){
  const tch = CACHE.teachers.find(x => x.ID === id);
  if (!tch) return;
  document.getElementById('adminContent').innerHTML = `
    <div class="card" style="border:3px solid #c0392b">
      <h4 style="color:#c0392b">⚠️ নিশ্চিত করুন</h4>
      <p style="margin:12px 0;font-size:15px">আপনি কি <b>${tch.Name_Bangla}</b> (${id})-কে <b style="color:#c0392b">সম্পূর্ণ ডিলিট</b> করতে চান?</p>
      <p style="font-size:13px;color:var(--text-muted)">এই কাজটি ফিরিয়ে আনা যাবে না।</p>
      <button class="danger" onclick="adminDoDelete('${id}')">🗑️ হ্যাঁ, ডিলিট করুন</button>
      <button class="secondary" onclick="adminView('list')">❌ বাতিল</button>
    </div>
  `;
}

async function adminDoDelete(id){
  document.getElementById('adminContent').innerHTML = loading();
  const r = await api('adminDeleteTeacher', { id });
  if (r.success) {
    toast('🗑️ ডিলিট হয়েছে', 'ok');
    await loadAllData();
    ADMIN_VIEW = 'list';
    renderAdminPanel();
  } else {
    toast('❌ ' + (r.error||''), 'err');
    renderAdminContent();
  }
}

// ---------- SUPERVISORS ----------
function adminSupervisorsView(){
  const sups = CACHE.supervisorList || [];
  return `
    <div class="card">
      <h4>👥 সুপারভাইজার (${sups.length})</h4>
      <button onclick="adminAddSupForm()" class="secondary">➕ নতুন সুপারভাইজার</button>
      <div id="supForm"></div>
      <div style="margin-top:14px">
        ${sups.map(s=>`
          <div class="attendance-row">
            <div style="font-weight:700;font-size:15px">${s.Name_Bangla} (${s.ID})</div>
            <div style="font-size:13px;color:var(--text-muted);margin-top:4px">📞 ${s.Phone||'—'}</div>
            <div style="font-size:13px;margin-top:4px">👥 ${String(s.Assigned_Teachers||'').split(',').filter(x=>x).length} জন শিক্ষক</div>
            <button class="secondary tiny" onclick="adminEditSup('${s.ID}')" style="margin-top:8px">✏️ পাসওয়ার্ড পরিবর্তন</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function adminAddSupForm(){
  const box = document.getElementById('supForm');
  if (box.innerHTML) { box.innerHTML=''; return; }
  box.innerHTML = `<div style="background:var(--bg);padding:12px;border-radius:10px;margin-top:10px">
    <label>নাম (বাংলা)</label><input id="ns_bn">
    <label>নাম (আরবী)</label><input id="ns_ar" dir="rtl">
    <label>ফোন</label><input id="ns_ph">
    <label>পাসওয়ার্ড</label><input id="ns_pw" placeholder="যেমন: sup1006">
    <button onclick="adminSaveSup()">✅ সেভ</button>
  </div>`;
}

async function adminSaveSup(){
  const bn = document.getElementById('ns_bn').value.trim();
  if (!bn) { toast('নাম দিন', 'err'); return; }
  const r = await api('adminAddSupervisor', {
    name_bn: bn,
    name_ar: document.getElementById('ns_ar').value.trim(),
    phone: document.getElementById('ns_ph').value.trim(),
    password: document.getElementById('ns_pw').value.trim()
  });
  if (r.success) { toast('✅ যোগ: ' + r.id, 'ok'); await loadAllData(); renderAdminPanel(); }
  else toast('❌ ' + (r.error||''), 'err');
}

function adminEditSup(id){
  const s = CACHE.supervisorList.find(x=>x.ID===id);
  if (!s) return;
  document.getElementById('adminContent').innerHTML = `
    <div class="card">
      <button class="secondary small" onclick="adminView('sups')" style="margin-bottom:12px">← ফিরে যান</button>
      <h4>✏️ ${s.Name_Bangla}</h4>
      <label>নাম (বাংলা)</label><input id="es_bn" value="${s.Name_Bangla||''}">
      <label>নাম (আরবী)</label><input id="es_ar" value="${s.Name_Arabic||''}" dir="rtl">
      <label>ফোন</label><input id="es_ph" value="${s.Phone||''}">
      <label>পাসওয়ার্ড</label><input id="es_pw" value="${s.Password||''}">
      <button onclick="adminSaveSupEdit('${id}')">✅ সেভ</button>
    </div>
  `;
}

async function adminSaveSupEdit(id){
  const r = await api('adminUpdateSupervisor', {
    id,
    name_bn: document.getElementById('es_bn').value.trim(),
    name_ar: document.getElementById('es_ar').value.trim(),
    phone: document.getElementById('es_ph').value.trim(),
    password: document.getElementById('es_pw').value.trim()
  });
  if (r.success) { toast('✅ আপডেট', 'ok'); await loadAllData(); ADMIN_VIEW='sups'; renderAdminPanel(); }
  else toast('❌ ' + (r.error||''), 'err');
}

// ---------- DEPARTMENTS ----------
async function loadDeptView(){
  const box = document.getElementById('adminContent');
  box.innerHTML = loading();
  const r = await api('getDepartments');
  if (!r.success) { box.innerHTML = '<div class="card"><p>ডাটা নেই</p></div>'; return; }
  CACHE.departments = r.data;
  box.innerHTML = `
    <div class="card">
      <h4>🏢 বিভাগসমূহ (${r.data.length})</h4>
      ${r.data.map(d=>`<div class="attendance-row">
        <div style="font-weight:700">${d.Name}</div>
        <div style="font-size:12px;color:var(--text-muted)">ID: ${d.ID}</div>
      </div>`).join('')}
      <label style="margin-top:14px">নতুন বিভাগ</label>
      <input id="nd_name" placeholder="বিভাগের নাম">
      <button onclick="adminSaveDept()">➕ যোগ করুন</button>
    </div>
  `;
}

async function adminSaveDept(){
  const name = document.getElementById('nd_name').value.trim();
  if (!name) return;
  const r = await api('adminAddDepartment', { name });
  if (r.success) { toast('✅ যোগ হয়েছে', 'ok'); loadDeptView(); }
  else toast('❌ ' + (r.error||''), 'err');
}

// ---------- LOG ----------
async function loadAdminLog(){
  const box = document.getElementById('adminContent');
  const r = await api('adminGetLog');
  if (!r.success || !r.data.length) { box.innerHTML = '<div class="card"><p>কোনো লগ নেই</p></div>'; return; }
  box.innerHTML = `
    <div class="card">
      <h4>📋 লগ হিস্টোরি (শেষ ১০০)</h4>
      ${r.data.map(l=>`<div class="attendance-row">
        <div style="font-size:12px;color:var(--text-muted)">${String(l.Timestamp).slice(0,16).replace('T',' ')}</div>
        <div style="font-weight:700;font-size:14px;margin-top:4px">${l.Action}</div>
        <div style="font-size:13px;color:var(--text-muted);margin-top:2px">${l.Details}</div>
      </div>`).join('')}
    </div>
  `;
}
(async function init(){
applyTheme();
document.body.classList.toggle('ar', LANG === 'ar');
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if (USER) await loadAllData();
else render();
})();
</script>
</body>
</html>
